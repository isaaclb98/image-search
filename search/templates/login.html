<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in · Image Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ asset('css/tokens.css') }}">
  <link rel="stylesheet" href="{{ asset('css/glass.css') }}">
  <link rel="stylesheet" href="{{ asset('css/layout.css') }}">
  <style>
    .login-page {
      display: grid;
      place-items: center;
      min-height: 100vh;
      background: hsl(var(--bg-base));
    }
    .login-card {
      width: min(100% - var(--space-3) * 2, 24rem);
    }
    .login-card h1 {
      margin: 0;
      font-size: var(--text-xl);
      font-weight: var(--weight-bold);
      color: hsl(var(--fg));
    }
    .login-card .login-error {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      background: hsl(var(--err-500) / 10%);
      border: 1px solid hsl(var(--err-500) / 30%);
      border-radius: var(--radius-md);
      color: hsl(var(--err-500));
      font-size: var(--text-sm);
    }
    .login-field {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }
    .login-field label {
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      color: hsl(var(--ink-off-white));
    }
    .login-field input {
      padding: var(--space-2) var(--space-3);
      border: 1px solid hsl(var(--border-glass));
      border-radius: var(--radius-md);
      background: hsl(var(--surface-glass) / 50%);
      color: hsl(var(--fg));
      font-size: var(--text-sm);
      outline: none;
      transition: border-color var(--dur-base) var(--ease-out);
    }
    .login-field input:focus {
      border-color: hsl(var(--accent-500));
    }
    .login-submit {
      width: 100%;
    }
  </style>
</head>
<body class="app-body login-page">
  <div class="glass--sharp login-card" style="padding: var(--space-4);">
    <header style="margin-bottom: var(--space-4);">
      <h1>Sign in</h1>
    </header>

    {% if error %}
      <div class="login-error" role="alert">
        <span>{{ error }}</span>
      </div>
    {% endif %}

    <form method="post" action="/login" style="display: flex; flex-direction: column; gap: var(--space-3);">
      <input type="hidden" name="next" value="{{ next }}">

      <div class="login-field">
        <label for="login-email">Email</label>
        <input
          id="login-email"
          type="email"
          name="email"
          placeholder="you@example.com"
          required
          autofocus
          autocomplete="email"
        >
      </div>

      <div class="login-field">
        <label for="login-password">Password</label>
        <input
          id="login-password"
          type="password"
          name="password"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        >
      </div>

      <button type="submit" class="btn btn-primary login-submit">
        Sign in
      </button>
    </form>
  </div>
</body>
</html>
