<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Simple monochrome mark: a square with a small inset corner
    triangle to evoke a photo frame. Single fill colour, no
    gradients — designed to read clearly at favicon size (16-32px)
    on both light and dark browser chrome.

    `currentColor` lets the browser chrome pick the right tone
    via the favicon's media-query: light variant for light
    browser tabs, dark for dark. The single shape is enough.
  -->
  <rect x="4" y="6" width="24" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
  <path d="M11 22 L15 17 L19 21 L23 15 L25 17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="20" cy="12" r="1.5" fill="currentColor"/>
</svg>
