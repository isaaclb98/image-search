<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!--
    Brand favicon. The same sparkle / starburst used as the
    in-app brand mark (Icon.svelte's 'sparkle' glyph) so the
    browser-tab icon and the topbar logo read as the same
    product. Stroked (no fill) so the browser chrome picks the
    right tone via the favicon's own colour, but a `currentColor`
    fallback is fine on most platforms.

    The main sparkle is the two-crossing-diamond form; the small
    secondary sparkle in the upper-right is the same asymmetric
    detail from the in-app icon.

    Background: subtle rounded square so the icon reads on both
    light and dark tab strips. Using a glass-2 grey that fades
    into the page background on white tabs and stays subtle on
    dark tabs. If the browser supports `prefers-color-scheme`,
    the dark variant below darkens the background.
  -->
  <style>
    .bg { fill: rgba(255, 255, 255, 0.06); }
    .stroke { stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .fill { fill: currentColor; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: rgba(255, 255, 255, 0.08); }
    }
  </style>
  <rect class="bg" x="0" y="0" width="24" height="24" rx="5"/>
  <path class="stroke" d="M12 3.5 L12.7 9.4 L18.5 10.2 L12.7 11 L12 16.9 L11.3 11 L5.5 10.2 L11.3 9.4 Z"/>
  <path class="stroke" d="M18.5 14.5 L18.8 16.2 L20.5 16.5 L18.8 16.8 L18.5 18.5 L18.2 16.8 L16.5 16.5 L18.2 16.2 Z"/>
</svg>
