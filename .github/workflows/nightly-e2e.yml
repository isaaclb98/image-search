# .github/workflows/nightly-e2e.yml
#
# Nightly Playwright e2e run. Brings the search backend + SPA up,
# runs the e2e suite against it, tears it down.
#
# Why nightly, not on PR:
#   - The e2e suite hits a real backend with seeded demo data;
#     docker-compose stack + Qdrant boot + SPA build = 2-3 min
#     before the first test runs. Too slow for the PR feedback
#     loop. The dev-build backend unit/integration tests already
#     cover the contract; e2e catches SPA regressions that vitest
#     misses (hydration races, SvelteKit routing, screenshot diffs).
#   - `cron: 0 2 * * *` = 02:00 UTC nightly. GitHub-hosted runners
#     are free for public repos at this scale (~7 min/run × 30
#     runs/mo ≈ 3.5 hrs; well under the free 2,000 min/mo budget).
#
# What gets exercised:
#   - npm ci + npm run build → frontend/build/ (SvelteKit adapter-static)
#   - uv sync --extra dev → Python deps
#   - search.dev_server --no-model --demo-data → in-memory Qdrant +
#     20 synth JPEGs + SPA mounted on port 8000 (no SigLIP2 model
#     download — uses the registry mock)
#   - playwright test --reporter=github → ~14 e2e tests
#   - uploads frontend/playwright-report/ as `playwright-report`
#     artifact (14-day retention) on every run

name: nightly-e2e

on:
  workflow_dispatch:  # manual trigger only — see commit history for
                      # why the schedule was disabled.

# Concurrency cancel on manual re-dispatches so you don't burn
# runner-minutes re-running a stale job.
concurrency:
  group: nightly-e2e
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright e2e against dev server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-local-prefix: .venv
          python-version: "3.12"

      - name: Sync Python deps
        run: uv sync --extra dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        # The @playwright/test npm package doesn't ship the browser
        # binaries — they're downloaded on first use into
        # ~/.cache/ms-playwright/. CI runners don't have them cached
        # by default, so install chromium explicitly. --with-deps
        # pulls the apt deps too (libnss3, libatk, etc.) on
        # debian-based images.
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build SPA
        # adapter-static output lands in frontend/build. The
        # backend's create_app() mounts this via FRONTEND_DIR
        # when present, falls back to /app/static in production.
        working-directory: frontend
        run: npm run build

      # Start dev server, wait for /healthz, then run Playwright
      # against it — all in ONE step. Backgrounding the dev server
      # across separate GHA steps didn't work: the runner kills
      # child processes when each step's shell exits, so by the
      # time the "Run Playwright" step started, the server was
      # already gone (Playwright timed out waiting for the URL).
      # Co-locating keeps the dev server alive for the entire
      # playwright run; it dies naturally when the step ends.
      - name: Run dev server + Playwright e2e
        env:
          # SEARCH_NO_MODEL skips the SigLIP2 model load; the
          # registry's mock-1536 embedder is used instead
          # (deterministic vectors so screenshot diffs stay stable).
          # SEARCH_TEST_MODE flips the same env the test backend uses.
          SEARCH_TEST_MODE: "1"
          SEARCH_NO_MODEL: "1"
          LOG_LEVEL: "WARNING"
          # CI=true flips playwright to single-worker + 2 retries
          # (see frontend/playwright.config.ts).
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          mkdir -p .nightly-logs

          # --demo-data synthesises 20 JPEGs into
          # $TMPDIR/image-search-demo/ and indexes them into an
          # in-memory Qdrant. The server listens on :8000.
          uv run python -m search.dev_server \
            --no-model --demo-data \
            --host 127.0.0.1 --port 8000 \
            > .nightly-logs/dev-server.log 2>&1 &
          DEV_PID=$!
          echo "dev-server pid: $DEV_PID"

          # Poll /healthz — usually up in ~5s but Qdrant boot +
          # index init can take 30s+. If it doesn't come up in 60s,
          # surface the failure and exit non-zero so the run fails
          # cleanly with the dev-server log as context.
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1; then
              echo "dev-server up after ${i}s"
              break
            fi
            sleep 1
            if [ "$i" = 60 ]; then
              echo "dev-server failed to start; tail of log:"
              tail -40 .nightly-logs/dev-server.log
              kill $DEV_PID 2>/dev/null || true
              exit 1
            fi
          done

          # Run playwright against the live server. Cleanup on
          # exit so the next step (uploads) doesn't race the dying
          # server for the log file.
          trap 'kill $DEV_PID 2>/dev/null || true' EXIT
          cd frontend
          npx playwright test --reporter=github

      - name: Upload Playwright report
        # Both on success and failure — the report has the trace +
        # screenshots that make failures debuggable. 14 days is
        # enough to spot a regression over the last 1-2 weeks.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload dev-server log on failure
        # The Playwright report tells you what the UI did; the
        # dev-server log tells you what the backend did. Both are
        # needed to debug a flaky e2e.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-server-log
          path: .nightly-logs/
          retention-days: 14