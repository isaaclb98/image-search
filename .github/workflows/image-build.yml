# .github/workflows/image-build.yml
#
# Build the search-side container and push it to GitHub Container
# Registry so the k8s cluster (synced by ArgoCD from ~/projects/gitops)
# can pull a fresh image without a local Docker build.
#
# Tags:
#   - `:latest`         — always tracks main; what the cluster's
#                         StatefulSet pins to.
#   - `:sha-<7-char>`   — per-commit; useful for rollback or for
#                         promoting a specific commit to a stable
#                         tag later.
#
# Trigger filter: `on.push.paths` is an allowlist of paths whose
# presence in the diff is necessary to trigger a build. The Dockerfile
# only depends on `docker/Dockerfile.search`, `pyproject.toml`,
# `README.md`, `search/`, and `indexer/`; the workflow file itself
# is in the allowlist so editing CI still rebuilds. Touching tests/,
# LICENSE, plain markdown, or other non-build artifacts skips the
# build entirely — which is what we want, since the `dev-build.yml`
# workflow already covers tests/lint for feature branches.
#
# Layer cache: GHA backend (type=gha, mode=max) — keyed off the
# final layer hash so unchanged Dockerfile steps reuse the previous
# build's cache. The SigLIP2 model download layer in particular
# saves ~1.5 GB of network + disk per rebuild when only source
# changed.
#
# Required permission: `packages: write` (scoped to this job) so
# GITHUB_TOKEN can push to ghcr.io/<owner>/<repo> without storing
# a PAT as a secret. ArgoCD pulls the same image anonymously
# because ghcr.io packages default to public for GH Actions pushes
# from public repos.

name: image-build

on:
  # Manual trigger — useful for verifying a Dockerfile / workflow change
  # on a feature branch without merging to main first. ArgoCD only
  # watches the :latest tag on main, so a dispatch build on any other
  # branch produces a :sha-* image that nothing rolls to automatically.
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - docker/Dockerfile.search
      - pyproject.toml
      - README.md
      - search/**
      - indexer/**
      - scripts/**
      - frontend/**
      - image_search_kernel/**
      - .dockerignore
      - .github/workflows/image-build.yml

# Cancel any in-flight run on main so a fast follow-up push doesn't
# race the previous build's3-5 min of layer pulls + SigLIP2 download.
# Mirrors dev-build.yml's concurrency block.
concurrency:
  group: image-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=image-search
            org.opencontainers.image.description=Self-hosted semantic image search (SigLIP2 → Qdrant)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - name: Build (load locally for smoke test)
        # Build first, load into the local docker daemon so the
        # smoke test below can `docker run` it without a registry
        # round-trip. Push happens in a separate step after the
        # smoke test passes — a broken image never reaches GHCR.
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.search
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # cache-from intentionally omitted on first build with the
          # new single-container Dockerfile — the previous cache was
          # keyed off a different build context and reports a phantom
          # `/data` file that no longer exists. cache-to is still set
          # so subsequent rebuilds get the speedup.
          cache-to: type=gha,mode=max,scope=image-search-build

      - name: Smoke test (gunicorn --check-config)
        # Catches "forgot to import a module" / "syntax error inside
        # the container" class of bug BEFORE pushing to GHCR.
        # `--check-config` validates the module path + workers
        # without forking workers, so it finishes in <2s. The
        # SEARCH_TEST_MODE=1 skips the SigLIP2 model load.
        run: |
          docker run --rm \
            -e SEARCH_TEST_MODE=1 \
            -e PORT=8765 \
            ${{ steps.meta.outputs.tags }} \
            gunicorn --check-config \
              search.app:app \
              -b 0.0.0.0:8765 \
              -k uvicorn.workers.UvicornWorker \
              --workers 1 \
              --timeout 120

      - name: Push to ghcr.io
        # Separate step so the build (and its cache-to write) happen
        # once. The image is already tagged with the full ghcr.io
        # path by `load: true` above, so this is just a `docker push`.
        run: docker push ${{ steps.meta.outputs.tags }}
