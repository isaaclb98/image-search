# .github/workflows/dev-build.yml
#
# CI for the search + indexer + frontend split (post single-container
# refactor in 1b897206). Runs on every branch push and PR against main.
#
# What it covers:
#   Backend (Python 3.12) — `backend` job
#     - uv pip install -e ".[dev]"   (deps + ruff + pytest + mypy +
#                                    pytest-xdist — uv is 2-5× faster
#                                    than pip for our dep tree, and
#                                    caches the venv keyed on
#                                    pyproject.toml)
#     - ruff check --changed         (lint only the diff vs main on PRs;
#                                    falls back to full lint on pushes
#                                    to feature branches so we still
#                                    catch regressions introduced by
#                                    recent commits in this run)
#     - pytest tests/ -q -n auto     (~720 tests, in-memory Qdrant
#                                    injected via the qdrant_in_memory
#                                    fixture — see tests/conftest.py)
#     - mypy image_search_kernel/    (strict per mypy.ini; was previously
#                                    CI-orphaned, now enforced on every
#                                    change to the kernel package)
#
#   Frontend (Node 22) — `frontend` job
#     - npm ci                       (deterministic install from
#                                    package-lock.json)
#     - npm run check                (svelte-kit sync + svelte-check)
#     - npm run test:unit            (27 vitest tests across 3 files)
#
# Parallelization:
#   The two jobs are independent and run in parallel. Wall-clock CI
#   time is bounded by max(backend, frontend) instead of
#   backend + frontend. With uv + xdist on the backend, both jobs
#   typically finish within ~1–2 min of each other on a 2-core runner,
#   so overall wall-clock roughly halves vs the old single-job pipeline.
#
# Path filters (two layers):
#   1. Workflow-level `paths:` allowlist skips the whole run for
#      pure-doc commits (README.md, LICENSE, docs/**, .gitignore,
#      pure-root .md files). Touching tests/, search/, indexer/,
#      image_search_kernel/, frontend/, pyproject.toml, mypy.ini,
#      docker/, docker-compose*, scripts/, or CI still triggers.
#   2. Per-job `if: needs.filter.outputs.<side>` gates each job off
#      when only the OTHER side changed. dorny/paths-filter inspects
#      the diff and exposes `backend_changed` / `frontend_changed`
#      booleans; the job step's `if:` then short-circuits the
#      install + test cost entirely. This means a frontend-only PR
#      doesn't pay the Python install tax, and vice versa.
#
# Concurrency:
#   Same as before — cancel any in-flight run on the same ref so
#   superseded pushes don't waste runners.
#
# What it deliberately does NOT do:
#   - Build the search container image. That's image-build.yml, gated
#     to main with a path allowlist (avoids redundant builds for
#     doc-only or test-only commits).
#   - Run Playwright e2e. Those need a live search backend on :8000
#     and a Qdrant collection; both are out of scope for the branch
#     feedback loop. Run them locally with
#     `cd frontend && npm run test:e2e` against
#     `python -m search.dev_server --demo-data`.
#   - Download SigLIP2 weights. Tests use the in-process MockEmbedder
#     registered in tests/conftest.py:_register_test_model, so the
#     ~3 GB HuggingFace cache download is skipped.

name: dev-build

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "fixes/**"
      - "perf/**"
    # Workflow-level allowlist. Same semantics for PRs below.
    # Touching anything outside this set skips the whole run —
    # e.g. editing README.md alone won't burn CI minutes.
    paths:
      - "search/**"
      - "indexer/**"
      - "image_search_kernel/**"
      - "tests/**"
      - "frontend/**"
      - "pyproject.toml"
      - "mypy.ini"
      - "docker/**"
      - "docker-compose.yml"
      - "docker-compose.override.yml"
      - ".env.example"
      - ".dockerignore"
      - "scripts/**"
      - ".github/workflows/**"
      - "image_search.egg-info/**"
  pull_request:
    branches:
      - main
    paths:
      - "search/**"
      - "indexer/**"
      - "image_search_kernel/**"
      - "tests/**"
      - "frontend/**"
      - "pyproject.toml"
      - "mypy.ini"
      - "docker/**"
      - "docker-compose.yml"
      - "docker-compose.override.yml"
      - ".env.example"
      - ".dockerignore"
      - "scripts/**"
      - ".github/workflows/**"
      - "image_search.egg-info/**"

# Cancel any in-flight run on the same ref so superseded pushes don't
# waste runners.
concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Per-side change detector
  # ---------------------------------------------------------------------
  # dorny/paths-filter inspects the PR/push diff against the merge base
  # and exposes booleans for the downstream jobs. `backend_changed` is
  # true when any Python package, pyproject.toml, mypy.ini, docker, or
  # CI config touched; `frontend_changed` is true when frontend/**,
  # package.json, or package-lock.json touched. Either being true
  # (or, for pushes to feature branches with no diff — e.g. first
  # commit — the `always()` fallback) keeps the workflow green.
  filter:
    name: Detect changed sides
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      backend_changed: ${{ steps.filter.outputs.backend }}
      frontend_changed: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Token-only filters: blank means "always changed" and acts
          # as the safe fallback. In practice the workflow-level paths:
          # allowlist already filters at the trigger level, so by the
          # time we get here at least one of backend/frontend is true.
          filters: |
            backend:
              - "search/**"
              - "indexer/**"
              - "image_search_kernel/**"
              - "tests/**"
              - "pyproject.toml"
              - "mypy.ini"
              - "docker/**"
              - "docker-compose.yml"
              - "docker-compose.override.yml"
              - ".env.example"
              - ".dockerignore"
              - "scripts/**"
              - ".github/workflows/**"
            frontend:
              - "frontend/**"
              - "package.json"
              - "package-lock.json"

  # ---------------------------------------------------------------------
  # Backend (Python)
  # ---------------------------------------------------------------------
  backend:
    name: Backend (Python)
    needs: filter
    if: needs.filter.outputs.backend_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          enable-cache: true
          # Cache the venv itself (not just the download cache),
          # keyed on pyproject.toml + uv.lock if it exists. Backed
          # by GHA's per-key cache service — no manual key math.
          cache-local-prefix: .venv
          python-version: "3.12"

      - name: Sync dev dependencies
        # `uv sync --extra dev` creates .venv and installs both the
        # project deps and the [dev] extra (pytest, ruff, mypy,
        # pytest-xdist) in one resolver pass. The setup-uv cache
        # above makes subsequent runs near-instant when
        # pyproject.toml hasn't moved.
        run: uv sync --extra dev

      - name: Lint (ruff, changed only)
        # On PRs we lint only the diff vs origin/main — fast, and
        # catches new issues without re-flagging pre-existing ones.
        # On pushes to feature branches we lint everything in the
        # latest commit so we don't let regressions sneak in via
        # "I'll fix that later" follow-up commits in the same push.
        # ruff's --changed is git-aware and uses origin/main as the
        # merge base by default.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            uv run ruff check --changed
          else
            uv run ruff check .
          fi

      - name: Type-check (mypy strict, kernel only)
        # mypy.ini scopes this to image_search_kernel/ with strict
        # mode per the plan §4.13 mandate. The kernel is the shared
        # package used by both search/ and indexer/, so type drift
        # here would break both downstream consumers.
        run: uv run mypy image_search_kernel/

      - name: Run pytest
        # `-n auto` lets pytest-xdist detect CPU count on the runner
        # and fan out. ~720 tests × in-memory Qdrant typically
        # finishes in well under a minute on 2 workers; the previous
        # serial run took ~2-3× that. Same in-memory Qdrant
        # fixture, same env vars (qdrant_url.client_kwargs() rejects
        # `memory://`).
        #
        # T1.3: --cov gates CI on a coverage threshold (currently
        # 70% — see [tool.coverage.report] in pyproject.toml). Drift
        # below the threshold fails the build even if all tests pass.
        #
        # --cov-report=xml produces coverage.xml, uploaded as the
        # `coverage-report` artifact below so PR reviewers can browse
        # which files/branches regressed.
        # --junitxml produces pytest-junit.xml, which GHA's Test
        # Results tab picks up automatically — surfaces the pass/
        # fail tree on every run without scrolling logs.
        run: |
          QDRANT_URL="http://localhost:6333" \
          SEARCH_TEST_MODE=1 \
          LOG_LEVEL="WARNING" \
            uv run pytest tests/ -q -n auto --tb=short \
              --cov --cov-fail-under=70 \
              --cov-report=xml --cov-report=term-missing \
              --junitxml=pytest-junit.xml

      - name: Cache .pytest_cache
        # Pure speedup: the next run's collection phase is faster.
        # Cheap, no downside.
        if: always()
        uses: actions/cache@v4
        with:
          path: .pytest_cache
          key: pytest-cache-${{ github.run_id }}
          restore-keys: pytest-cache-

      - name: Upload coverage report
        # coverage.xml is the same file Codecov / Coveralls consume
        # and is also browseable via raw GitHub. Retention 30 days —
        # long enough to spot a regression over the last few pushes.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # ---------------------------------------------------------------------
  # Frontend (Node)
  # ---------------------------------------------------------------------
  frontend:
    name: Frontend (Node)
    needs: filter
    if: needs.filter.outputs.frontend_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: svelte-check (type + a11y)
        working-directory: frontend
        run: npm run check

      - name: Vitest (unit + contract)
        working-directory: frontend
        run: npm run test:unit