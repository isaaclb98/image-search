[project]
name = "isaac-image-search"
version = "0.1.0"
description = "Personal image search engine. NAS -> SigLIP2 -> Qdrant -> text/image queries."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Isaac" }]

dependencies = [
    # Search side (FastAPI app)
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "qdrant-client>=1.10",
    # .env file loading (used by both indexer + search)
    "python-dotenv>=1.0",
    # SigLIP2 model loading — open_clip (matches isaac-image-scoring)
    "open_clip_torch>=2.31.0",
    "timm>=1.0.15",
    "torch>=2.1",
    "torchvision>=0.16",
    "pillow>=10",
    "pillow-heif>=0.16",
    "tqdm>=4.66",
    # Streaming ZIP archive for /favorites/download.zip — doesn't
    # buffer the whole archive in memory.
    "zipstream-ng>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
    "anyio>=4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["search", "indexer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
