[project]
name = "image-search"
version = "0.1.0"
description = "Self-hosted semantic image search. SigLIP2 embeddings → Qdrant → text/image queries."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Isaac" }]

dependencies = [
    # Search side (FastAPI app)
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    # gunicorn is the process manager for the single-container image
    # (docker/Dockerfile.search runs `gunicorn -k uvicorn.workers.UvicornWorker`).
    # Without it the container fails with `exec: gunicorn: not found`.
    "gunicorn>=21.2",
    "qdrant-client>=1.10",
    # .env file loading (used by both indexer + search)
    "python-dotenv>=1.0",
    # SigLIP2 model loading — open_clip (matches isaac-image-scoring)
    "open_clip_torch>=2.31.0",
    # open_clip's tokenizer path lazy-imports `transformers.AutoTokenizer`
    # at runtime (see vendor/open_clip/tokenizer.py:451). Without this,
    # the Dockerfile pre-warm step (Dockerfile.search:37) fails with
    # `ModuleNotFoundError: No module named 'transformers'`.
    "transformers>=4.40",
    "timm>=1.0.15",
    "torch>=2.1",
    "torchvision>=0.16",
    "pillow>=10",
    "pillow-heif>=0.16",
    "blurhash>=1.0",  # LQIP placeholders — computed at index time, decoded client-side
    "tqdm>=4.66",
    # Streaming ZIP archive for /favorites/download.zip — doesn't
    # buffer the whole archive in memory.
    "zipstream-ng>=1.1",
    # Single-user app-level login (search/auth.py). bcrypt is the
    # password KDF; itsdangerous signs the session cookie. See
    # .env.example for the AUTH_* configuration knobs.
    "bcrypt>=4.0",
    "itsdangerous>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
    "anyio>=4",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["search", "indexer", "image_search_kernel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Defaults are F (pyflakes) + E/W (pycodestyle). Add I (isort) so
# imports stay sorted as the codebase grows. Security (S) + comprehensions
# (C4) + simplification (SIM) catch the cheap categories without
# triggering on legacy templates; bump selectively later.
extend-select = ["I", "S", "C4", "SIM", "B", "UP"]
# Per-file opt-outs for paths that legitimately don't need linting.
[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",  # `assert` is the whole point of tests
    # Tests legitimately catch broad exceptions (PIL feature probes,
    # mock fall-throughs, etc.) and use fixture passwords.
    "BLE001",
    "S105",
    # Cheap-to-fix style nits we don't want blocking CI for tests.
    "C408",
    "RUF059",
    # Inline imports inside test fixtures (semicolon-separated
    # multi-statements, conditional imports, fixture-local helpers)
    # are inherently hard to order in a way ruff's isort agrees with.
    # Suppress I001 for tests/ rather than restructuring dozens of
    # working fixture bodies. See lint step 13 in the commit log.
    "I001",
]
"bin/*" = ["T201", "S"]  # CLI helpers may print freely
# scripts/ and benchmarks/ are dev tools invoked manually from the
# repo root, not part of the package or its tests. They're allowed
# the same leeway as bin/: print freely, use simple random
# (image-synth), open user-supplied URLs, write to /tmp, use asserts
# in micro-benchmarks. None of this code ships in the package or runs
# under CI's test path.
"scripts/*" = [
    "T201",   # print()
    "S",      # security audits (URL schemes, /tmp, etc.) — dev tool
    "EXE001", # shebangs without +x — invoked via `python scripts/foo.py`
    "B007",   # unused loop vars
    "PERF102",# use .values() — micro-perf, not relevant for one-shot scripts
]
"benchmarks/*" = [
    "S101",   # asserts are the point of micro-benchmarks
    "S311",   # deterministic-but-not-cryptographic random is fine for synth
    "S",      # dev tool, same leeway as scripts/
    "B007",
]
# Don't touch vendored / generated artifacts.
"**/__pycache__" = ["F401", "F403"]
".venv/**" = ["F401", "F403", "E402"]
