# End-user deployment recipe. Pulls image-search from ghcr and runs
# it alongside Qdrant as a sidecar. Bind-mount your photo library
# at /nas, then visit http://localhost:8000.
#
# Required:
#   NAS_IMAGES_PATH=/abs/path/to/your/photos   (read-only is fine)
#
# Optional:
#   WEB_UI_URL=http://your-public-url   (used in API response links;
#                                        defaults to localhost:8000)
#
# State:
#   qdrant_data              — vector index + payloads
#   image-search_search_data — SQLite side store (favorites, dislikes,
#                              albums, saved searches), SigLIP2 model
#                              cache, runtime thumbnail cache. KEEP
#                              this volume — without it, every image
#                              update wipes your library state.
#
# First start downloads the SigLIP2 model (~30 s, then cached in
# image-search_search_data). After that, indexing happens via the
# in-app Settings → Index button — no host tooling required.

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: image-search-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q 'healthz check passed' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  search:
    image: ghcr.io/isaaclb98/image-search:latest
    pull_policy: always
    container_name: image-search
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: images
      # QDRANT_API_KEY: replace-with-your-key  # Required if your Qdrant has auth enabled
      NAS_IMAGES_BASE: /nas
      THUMBNAIL_DIR: /app/data/thumbnails
      WEB_UI_URL: ${WEB_UI_URL:-http://localhost:8000}
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount your photo library read-only at /nas.
      - ${NAS_IMAGES_PATH}:/nas:ro
      # Persist SQLite side store + HF model cache + thumbnails across
      # image updates. Critical — without this volume, every container
      # restart after a `:latest` pull wipes user state.
      - image-search_search_data:/app/data

volumes:
  qdrant_data:
  image-search_search_data:
